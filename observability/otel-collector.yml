receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch/traces:
    timeout: 5s
    send_batch_size: 256
  batch/metrics:
    timeout: 15s
    send_batch_size: 512
  batch/logs:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9090
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch/traces]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch/metrics]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch/logs]
      exporters: [otlp_http/loki]
