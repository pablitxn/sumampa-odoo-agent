services:
  postgres:
    image: postgres:16
    container_name: sumampa-odoo-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sumampa_odoo_agent}
      POSTGRES_USER: ${POSTGRES_USER:-orchid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-orchid} -d ${POSTGRES_DB:-sumampa_odoo_agent}
      interval: 5s
      timeout: 5s
      retries: 10
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${POSTGRES_PASSWORD}" || { echo "Set private database credentials"
      >&2; exit 1; }; exec docker-entrypoint.sh "$@"
    - --
    command:
    - postgres
  redis:
    image: redis:7
    container_name: sumampa-odoo-agent-redis
    ports:
    - 127.0.0.1:6379:6379
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: sumampa-odoo-agent-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    command:
    - server
    - /data
    - --console-address
    - :9001
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/ready
      interval: 5s
      timeout: 5s
      retries: 10
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${MINIO_ROOT_USER}" && test -n "$${MINIO_ROOT_PASSWORD}" || { echo
      "Set private MinIO credentials" >&2; exit 1; }; exec /usr/bin/docker-entrypoint.sh
      "$@"
    - --
  minio-init:
    image: minio/mc:latest
    container_name: sumampa-odoo-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      ATTACHMENT_BUCKET: ${ATTACHMENT_BUCKET:-sumampa-attachments}
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${MINIO_ROOT_USER}" && test -n "$${MINIO_ROOT_PASSWORD}"; mc alias
      set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing "local/$${ATTACHMENT_BUCKET}"
  odoo-postgres:
    image: postgres:16
    container_name: sumampa-odoo-agent-odoo19-postgres
    profiles:
    - odoo
    environment:
      POSTGRES_DB: ${ODOO_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${ODOO_POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-}
    ports:
    - 127.0.0.1:5433:5432
    volumes:
    - odoo19_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${ODOO_POSTGRES_USER:-odoo} -d ${ODOO_POSTGRES_DB:-postgres}
      interval: 5s
      timeout: 5s
      retries: 20
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${POSTGRES_PASSWORD}" || { echo "Set private database credentials"
      >&2; exit 1; }; exec docker-entrypoint.sh "$@"
    - --
    command:
    - postgres
  odoo19:
    image: odoo:19.0
    container_name: sumampa-odoo-agent-odoo19
    profiles:
    - odoo
    depends_on:
      odoo-postgres:
        condition: service_healthy
    environment:
      HOST: odoo-postgres
      PORT: 5432
      USER: ${ODOO_POSTGRES_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-}
    ports:
    - 127.0.0.1:8069:8069
    volumes:
    - ./config/odoo/odoo.integration.conf:/etc/odoo/odoo.conf:ro
    - odoo19_data:/var/lib/odoo
    command:
    - odoo
    - --config=/etc/odoo/odoo.conf
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sumampa-odoo-agent-otel-collector
    profiles:
    - observability
    command:
    - --config=/etc/otelcol/config.yml
    volumes:
    - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
    - 127.0.0.1:4317:4317
    - 127.0.0.1:4318:4318
    depends_on:
    - tempo
    - loki
  phoenix-postgres:
    image: postgres:16
    container_name: sumampa-odoo-agent-phoenix-postgres
    profiles:
    - observability
    environment:
      POSTGRES_DB: ${PHOENIX_POSTGRES_DB:-phoenix}
      POSTGRES_USER: ${PHOENIX_POSTGRES_USER:-phoenix}
      POSTGRES_PASSWORD: ${PHOENIX_POSTGRES_PASSWORD:-}
    volumes:
    - phoenix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${PHOENIX_POSTGRES_USER:-phoenix} -d ${PHOENIX_POSTGRES_DB:-phoenix}
      interval: 5s
      timeout: 5s
      retries: 20
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${POSTGRES_PASSWORD}" || { echo "Set private database credentials"
      >&2; exit 1; }; exec docker-entrypoint.sh "$@"
    - --
    command:
    - postgres
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: sumampa-odoo-agent-phoenix
    profiles:
    - observability
    depends_on:
      phoenix-postgres:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: ${PHOENIX_SQL_DATABASE_URL:-}
      PHOENIX_PORT: 6006
    ports:
    - 127.0.0.1:6006:6006
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:6006', timeout=5).read()
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  prometheus:
    image: prom/prometheus:latest
    container_name: sumampa-odoo-agent-prometheus
    profiles:
    - observability
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-otlp-receiver
    volumes:
    - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    ports:
    - 127.0.0.1:9090:9090
    depends_on:
    - otel-collector
  loki:
    image: grafana/loki:latest
    container_name: sumampa-odoo-agent-loki
    profiles:
    - observability
    command:
    - -config.file=/etc/loki/config.yml
    volumes:
    - ./observability/loki.yml:/etc/loki/config.yml:ro
    - loki_data:/loki
    ports:
    - 127.0.0.1:3100:3100
  tempo:
    image: grafana/tempo:latest
    container_name: sumampa-odoo-agent-tempo
    profiles:
    - observability
    command:
    - -config.file=/etc/tempo/config.yml
    volumes:
    - ./observability/tempo.yml:/etc/tempo/config.yml:ro
    - tempo_data:/tmp/tempo
    ports:
    - 127.0.0.1:3200:3200
  grafana:
    image: grafana/grafana:latest
    container_name: sumampa-odoo-agent-grafana
    profiles:
    - observability
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
    ports:
    - 127.0.0.1:3001:3000
    depends_on:
    - prometheus
    - loki
    - tempo
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "Set private Grafana credentials"
      >&2; exit 1; }; exec /run.sh
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  odoo19_postgres_data: null
  odoo19_data: null
  prometheus_data: null
  loki_data: null
  tempo_data: null
  grafana_data: null
  phoenix_postgres_data: null
