services:
  postgres:
    image: postgres:16
    container_name: sumampa-odoo-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sumampa_odoo_agent}
      POSTGRES_USER: ${POSTGRES_USER:-orchid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-orchid} -d ${POSTGRES_DB:-sumampa_odoo_agent}
      interval: 5s
      timeout: 5s
      retries: 10
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${POSTGRES_PASSWORD}" || { echo "Set private database credentials"
      >&2; exit 1; }; exec docker-entrypoint.sh "$@"
    - --
    command:
    - postgres
  redis:
    image: redis:7
    container_name: sumampa-odoo-agent-redis
    ports:
    - 127.0.0.1:6379:6379
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: sumampa-odoo-agent-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    command:
    - server
    - /data
    - --console-address
    - :9001
    volumes:
    - minio_data:/data
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${MINIO_ROOT_USER}" && test -n "$${MINIO_ROOT_PASSWORD}" || { echo
      "Set private MinIO credentials" >&2; exit 1; }; exec /usr/bin/docker-entrypoint.sh
      "$@"
    - --
  minio-init:
    image: minio/mc:latest
    container_name: sumampa-odoo-agent-minio-init
    depends_on:
    - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      ATTACHMENT_BUCKET: ${ATTACHMENT_BUCKET:-sumampa-attachments}
    entrypoint:
    - /bin/sh
    - -ec
    - test -n "$${MINIO_ROOT_USER}" && test -n "$${MINIO_ROOT_PASSWORD}"; mc alias
      set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing "local/$${ATTACHMENT_BUCKET}"
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
