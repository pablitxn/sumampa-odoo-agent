schema_version = "1.1"

[task]
name = "sumampa/odoo-fullstack-search-seeded-supplier"
description = "Calls the Sumampa API against seeded Odoo JSON-RPC sidecars and verifies the response."
keywords = ["sumampa", "odoo", "phoenix", "fullstack", "whatsapp"]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 300.0

[verifier.env]
SUMAMPA_API_BASE_URL = "http://sumampa-app:8000"
HARBOR_TASK_ID = "sumampa/odoo-fullstack-search-seeded-supplier"
PHOENIX_PROJECT_NAME = "${PHOENIX_PROJECT_NAME}"
GIT_SHA = "${GIT_SHA}"
AGENT_MODEL = "${AGENT_MODEL}"

[environment]
build_timeout_sec = 600.0
workdir = "/app"
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true
