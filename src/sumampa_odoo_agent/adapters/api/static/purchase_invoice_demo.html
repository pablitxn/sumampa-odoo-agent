<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sumampa Compras Chat</title>
    <style>
      :root {
        --bg: #e8ddd1;
        --panel: #efe7dc;
        --line: #d1c2b1;
        --ink: #201913;
        --muted: #6d645b;
        --user: #d8f7c9;
        --agent: #ffffff;
        --composer: #f6efe7;
        --accent: #1f7a54;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.45), transparent 24rem),
          linear-gradient(180deg, #d9ccb9, var(--bg));
      }
      .shell {
        width: min(100vw, 460px);
        height: 100dvh;
        margin: 0 auto;
      }
      .chat {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--panel);
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 250, 244, 0.82);
        backdrop-filter: blur(8px);
      }
      .title {
        margin: 0;
        font-family: "IBM Plex Serif", Georgia, serif;
        font-size: 1.05rem;
      }
      .messages {
        min-height: 0;
        overflow-y: auto;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.18)),
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.45), transparent 18rem);
      }
      .msg {
        max-width: 84%;
        padding: 10px 12px;
        border-radius: 16px;
        line-height: 1.4;
        box-shadow: 0 8px 24px rgba(58, 36, 15, 0.08);
        animation: rise 160ms ease;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
        border-bottom-right-radius: 6px;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--agent);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-bottom-left-radius: 6px;
      }
      .meta {
        margin-bottom: 4px;
        font-size: 0.76rem;
        color: var(--muted);
      }
      .msg-body {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .composer {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-top: 1px solid var(--line);
        background: var(--composer);
      }
      .status {
        min-height: 1.1rem;
        margin: 0;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .attach-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .attach-row input[type="file"] {
        min-width: 0;
        font: inherit;
      }
      textarea,
      button {
        font: inherit;
      }
      textarea {
        width: 100%;
        min-height: 92px;
        max-height: 180px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
        color: var(--ink);
        background: #fffdfa;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      .send-wrap {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 11px 16px;
        cursor: pointer;
      }
      #sendBtn {
        background: var(--accent);
        color: white;
        font-weight: 600;
      }
      #resetBtn {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: white;
        animation: spin 700ms linear infinite;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @media (min-width: 640px) {
        body {
          display: grid;
          place-items: center;
          padding: 16px;
        }
        .shell {
          height: min(92dvh, 860px);
        }
        .chat {
          border: 1px solid rgba(86, 63, 39, 0.12);
          border-radius: 28px;
          overflow: hidden;
          box-shadow: 0 18px 50px rgba(53, 34, 17, 0.18);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="chat">
        <div class="head">
          <h1 class="title" data-copy-text="chat_title"></h1>
          <button id="resetBtn" type="button" data-copy-text="reset_button"></button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <label class="attach-row">
            <span data-copy-text="invoice_attachment_label"></span>
            <input id="invoiceImage" type="file" accept="image/*,.pdf" multiple />
          </label>
          <p class="status" id="statusLine" hidden></p>
          <textarea id="messageInput" data-copy-placeholder="message_placeholder"></textarea>
          <div class="actions">
            <div></div>
            <button id="sendBtn" type="button">
              <span class="send-wrap">
                <span id="sendSpinner" class="spinner" hidden></span>
                <span id="sendLabel" data-copy-text="send_button"></span>
              </span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <script src="/demo/purchase-invoices-copy.js"></script>
    <script>
      const COPY = window.PURCHASE_INVOICE_DEMO_COPY || {};
      const messages = document.getElementById("messages");
      const sendBtn = document.getElementById("sendBtn");
      const sendSpinner = document.getElementById("sendSpinner");
      const sendLabel = document.getElementById("sendLabel");
      const resetBtn = document.getElementById("resetBtn");
      const messageInput = document.getElementById("messageInput");
      const invoiceImage = document.getElementById("invoiceImage");
      const statusLine = document.getElementById("statusLine");
      const runtimeContext = {
        supplier_name: "",
        supplier_vat: "",
        markup_percentage: "30",
        supplier_id: "",
        journal_id: "",
        picking_type_id: "",
        location_id: "",
        location_dest_id: "",
        create_stock_receipt: "true",
      };
      let sessionId = null;

      function t(key) {
        return COPY[key] || key;
      }

      function hydrateStaticCopy() {
        document.querySelectorAll("[data-copy-text]").forEach((node) => {
          node.textContent = t(node.dataset.copyText);
        });
        document.querySelectorAll("[data-copy-placeholder]").forEach((node) => {
          node.placeholder = t(node.dataset.copyPlaceholder);
        });
      }

      function addMessage(role, text) {
        const node = document.createElement("article");
        const meta = document.createElement("div");
        const body = document.createElement("div");

        node.className = `msg ${role}`;
        meta.className = "meta";
        meta.textContent = role === "agent" ? t("agent_meta") : t("user_meta");
        body.className = "msg-body";
        body.textContent = text;

        node.append(meta, body);
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
      }

      function setStatus(text = "") {
        statusLine.textContent = text;
        statusLine.hidden = !text;
      }

      function setPendingState(isPending) {
        sendBtn.disabled = isPending;
        resetBtn.disabled = isPending;
        messageInput.disabled = isPending;
        invoiceImage.disabled = isPending;
        sendSpinner.hidden = !isPending;
        sendLabel.textContent = isPending ? t("sending_status") : t("send_button");
      }

      function buildForm(text, files) {
        const form = new FormData();
        form.append("message", text);
        if (sessionId) form.append("session_id", sessionId);
        for (const [key, value] of Object.entries(runtimeContext)) {
          form.append(key, value);
        }
        for (const file of files) {
          form.append("invoice_images", file);
        }
        return form;
      }

      async function fetchFirstHit(path, query) {
        const response = await fetch(`${path}?query=${encodeURIComponent(query)}&limit=1`);
        const payload = await response.json();
        if (!response.ok || !payload.hits?.length) {
          throw new Error(`${path}:${query}`);
        }
        return payload.hits[0];
      }

      async function loadLocalDefaults() {
        try {
          const [journal, pickingType, vendorLocation, stockLocation] = await Promise.all([
            fetchFirstHit("/api/v1/odoo/journals/search", "purchase"),
            fetchFirstHit("/api/v1/odoo/picking-types/search", "incoming"),
            fetchFirstHit("/api/v1/odoo/locations/search", "Vendors"),
            fetchFirstHit("/api/v1/odoo/locations/search", "Stock"),
          ]);
          runtimeContext.journal_id = String(journal.id);
          runtimeContext.picking_type_id = String(pickingType.id);
          runtimeContext.location_id = String(vendorLocation.id);
          runtimeContext.location_dest_id = String(stockLocation.id);
        } catch (error) {
          console.warn(t("defaults_load_failed"), error);
        }
      }

      function buildUserTurnText(text, files) {
        const chunks = [];
        if (text) chunks.push(text);
        if (files.length) chunks.push(files.map((file) => file.name).join("\n"));
        return chunks.join("\n");
      }

      async function sendTurn() {
        const text = messageInput.value.trim();
        const files = Array.from(invoiceImage.files || []);
        if (!text && files.length === 0) {
          setStatus(t("missing_input_status"));
          messageInput.focus();
          return;
        }

        const form = buildForm(text, files);
        setStatus("");
        addMessage("user", buildUserTurnText(text, files));
        messageInput.value = "";
        invoiceImage.value = "";
        setPendingState(true);

        try {
          const response = await fetch("/api/v1/odoo/purchase-chat/messages", {
            method: "POST",
            body: form,
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.message || t("turn_processing_failed"));
          }
          sessionId = payload.session_id;
          addMessage("agent", payload.assistant_message || "");
          setStatus("");
        } catch (error) {
          messageInput.value = text;
          setStatus(error.message || t("turn_processing_failed"));
        } finally {
          setPendingState(false);
        }
      }

      function resetConversation() {
        sessionId = null;
        messages.innerHTML = "";
        messageInput.value = "";
        invoiceImage.value = "";
        setStatus("");
        setPendingState(false);
      }

      sendBtn.addEventListener("click", sendTurn);
      resetBtn.addEventListener("click", resetConversation);
      messageInput.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          sendTurn();
        }
      });

      hydrateStaticCopy();
      resetConversation();
      loadLocalDefaults();
    </script>
  </body>
</html>
