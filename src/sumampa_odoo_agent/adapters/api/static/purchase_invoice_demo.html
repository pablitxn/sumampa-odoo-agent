<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sumampa Compras Chat</title>
    <style>
      :root {
        --bg: #f6f0e7;
        --panel: rgba(255, 251, 245, 0.92);
        --ink: #201913;
        --muted: #72675d;
        --line: #dccfbe;
        --accent: #bf5b30;
        --accent-dark: #8d3d1d;
        --bubble-user: #2c241e;
        --bubble-agent: #fffaf3;
        --ok: #2e7047;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 0% 0%, #ffd7bf 0, transparent 28rem),
          linear-gradient(180deg, #efe4d6, var(--bg));
      }
      .shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 18px;
      }
      .sidebar, .chat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 14px 48px rgba(60, 36, 14, 0.08);
        backdrop-filter: blur(8px);
      }
      .sidebar { padding: 22px; }
      .chat {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 84vh;
      }
      h1, h2 { margin: 0 0 10px; font-family: "IBM Plex Serif", Georgia, serif; }
      .lede { color: var(--muted); line-height: 1.45; margin-bottom: 18px; }
      label {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 12px;
      }
      input, textarea, button {
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        padding: 12px 14px;
        font: inherit;
        color: var(--ink);
        background: #fffdfa;
      }
      input[type="file"] { padding: 10px; }
      textarea {
        resize: vertical;
        min-height: 84px;
      }
      button {
        border: none;
        color: white;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      }
      .ghost-button {
        background: #fff7ee;
        color: var(--accent-dark);
        border: 1px solid var(--line);
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .head {
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--line);
      }
      .messages {
        padding: 18px 22px;
        overflow: auto;
        display: grid;
        gap: 14px;
        align-content: start;
      }
      .composer {
        border-top: 1px solid var(--line);
        padding: 16px 18px 18px;
        display: grid;
        gap: 12px;
      }
      .msg {
        max-width: 88%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.45;
        animation: rise 180ms ease;
      }
      .msg.user {
        margin-left: auto;
        color: #fffaf1;
        background: var(--bubble-user);
      }
      .msg.agent {
        background: var(--bubble-agent);
        border: 1px solid var(--line);
      }
      .meta {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .pill {
        display: inline-flex;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f0d2c1;
        color: #6d2f11;
        font-size: 0.78rem;
        margin-right: 6px;
        margin-bottom: 6px;
      }
      .ok { color: var(--ok); }
      .proposal {
        margin-top: 10px;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }
      .proposal-line {
        padding: 8px 0;
        border-top: 1px dashed #eadfd2;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 10px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.8rem;
        background: #211a15;
        color: #f9ecde;
        padding: 12px;
        border-radius: 14px;
        overflow: auto;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 960px) {
        .shell { grid-template-columns: 1fr; }
        .chat { min-height: auto; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <h1 data-copy-text="sidebar_title"></h1>
        <p class="lede" data-copy-text="sidebar_lede"></p>
        <label><span data-copy-text="supplier_name_label"></span>
          <input id="supplierName" type="text" data-copy-placeholder="supplier_name_placeholder" />
        </label>
        <label><span data-copy-text="supplier_vat_label"></span>
          <input id="supplierVat" type="text" data-copy-placeholder="supplier_vat_placeholder" />
        </label>
        <label><span data-copy-text="markup_label"></span>
          <input id="markupPercentage" type="number" min="0" step="0.5" value="30" />
        </label>
        <label><span data-copy-text="supplier_id_label"></span>
          <input id="supplierId" type="number" min="1" data-copy-placeholder="supplier_id_placeholder" />
        </label>
        <label><span data-copy-text="journal_id_label"></span>
          <input id="journalId" type="number" min="1" data-copy-placeholder="journal_id_placeholder" />
        </label>
        <label><span data-copy-text="picking_type_id_label"></span>
          <input id="pickingTypeId" type="number" min="1" data-copy-placeholder="picking_type_id_placeholder" />
        </label>
        <label><span data-copy-text="location_id_label"></span>
          <input id="locationId" type="number" min="1" data-copy-placeholder="location_id_placeholder" />
        </label>
        <label><span data-copy-text="location_dest_id_label"></span>
          <input id="locationDestId" type="number" min="1" data-copy-placeholder="location_dest_id_placeholder" />
        </label>
        <label>
          <input id="createStockReceipt" type="checkbox" />
          <span data-copy-text="create_stock_receipt_label"></span>
        </label>
        <button id="loadDefaultsBtn" type="button" class="ghost-button" data-copy-text="load_defaults_button"></button>
      </aside>

      <section class="chat">
        <div class="head">
          <h2 data-copy-text="chat_title"></h2>
          <div class="meta" id="stageLabel"></div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <label><span data-copy-text="invoice_attachment_label"></span>
            <input id="invoiceImage" type="file" accept="image/*,.pdf" multiple />
          </label>
          <textarea id="messageInput" data-copy-placeholder="message_placeholder"></textarea>
          <div class="toolbar">
            <button id="sendBtn" data-copy-text="send_button"></button>
            <button id="resetBtn" type="button" data-copy-text="reset_button"></button>
          </div>
        </div>
      </section>
    </div>

    <script src="/demo/purchase-invoices-copy.js"></script>
    <script>
      const COPY = window.PURCHASE_INVOICE_DEMO_COPY || {};
      const messages = document.getElementById("messages");
      const stageLabel = document.getElementById("stageLabel");
      const sendBtn = document.getElementById("sendBtn");
      const resetBtn = document.getElementById("resetBtn");
      const loadDefaultsBtn = document.getElementById("loadDefaultsBtn");
      const messageInput = document.getElementById("messageInput");
      const invoiceImage = document.getElementById("invoiceImage");
      let sessionId = null;

      function t(key) {
        return COPY[key] || key;
      }

      function formatCopy(key, params = {}) {
        let template = t(key);
        for (const [paramKey, value] of Object.entries(params)) {
          template = template.replaceAll(`{${paramKey}}`, String(value));
        }
        return template;
      }

      function hydrateStaticCopy() {
        document.querySelectorAll("[data-copy-text]").forEach((node) => {
          node.textContent = t(node.dataset.copyText);
        });
        document.querySelectorAll("[data-copy-placeholder]").forEach((node) => {
          node.placeholder = t(node.dataset.copyPlaceholder);
        });
        stageLabel.textContent = t("new_session_label");
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function addMessage(role, html) {
        const node = document.createElement("article");
        node.className = `msg ${role}`;
        node.innerHTML = html;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
      }

      function renderProposal(proposal) {
        if (!proposal) return "";
        const warnings = proposal.warnings.length
          ? proposal.warnings.map((warning) => `<span class="pill">${escapeHtml(warning)}</span>`).join("")
          : `<span class="pill ok">${escapeHtml(t("no_strong_warnings"))}</span>`;
        const lines = proposal.lines.map((line) => `
          <div class="proposal-line">
            <strong>${escapeHtml(line.description)}</strong><br />
            ${escapeHtml(formatCopy("proposal_line_summary", {
              quantity: line.quantity,
              vat_rate: line.vat_rate,
              unit_price_net: line.unit_price_net,
              suggested_sale_price: line.suggested_sale_price,
            }))}<br />
            ${escapeHtml(formatCopy("proposal_match_summary", {
              display_name: line.product_match.display_name || t("proposal_match_fallback"),
              confidence: Math.round((line.product_match.confidence || 0) * 100),
            }))}
          </div>
        `).join("");
        return `
          <div class="proposal">
            <div><strong>${escapeHtml(proposal.document_type || t("proposal_document_fallback"))}</strong> ${escapeHtml(proposal.invoice_number || t("proposal_invoice_number_fallback"))} | ${escapeHtml(proposal.invoice_date || t("proposal_date_fallback"))}</div>
            <div>${escapeHtml(formatCopy("proposal_supplier_total", {
              supplier_name: proposal.supplier_name || t("proposal_supplier_fallback"),
              total: proposal.totals.total,
            }))}</div>
            <div style="margin-top:8px">${warnings}</div>
            ${lines}
          </div>
        `;
      }

      function renderApplyResult(result) {
        if (!result) return "";
        return `
          <details style="margin-top:10px">
            <summary>${escapeHtml(t("odoo_operations_summary"))}</summary>
            <pre>${escapeHtml(JSON.stringify(result, null, 2))}</pre>
          </details>
        `;
      }

      function appendAgentResponse(payload) {
        stageLabel.textContent = formatCopy("stage_session_label", {
          stage: payload.stage,
          session_id: payload.session_id,
        });
        const html = `
          <div class="meta">${escapeHtml(t("agent_meta"))}</div>
          ${escapeHtml(payload.assistant_message).replaceAll("\n", "<br />")}
          ${renderProposal(payload.proposal)}
          ${renderApplyResult(payload.last_apply_result)}
        `;
        addMessage("agent", html);
      }

      function buildForm() {
        const form = new FormData();
        form.append("message", messageInput.value);
        if (sessionId) form.append("session_id", sessionId);
        form.append("supplier_name", document.getElementById("supplierName").value);
        form.append("supplier_vat", document.getElementById("supplierVat").value);
        form.append("markup_percentage", document.getElementById("markupPercentage").value || "30");
        form.append("supplier_id", document.getElementById("supplierId").value);
        form.append("journal_id", document.getElementById("journalId").value);
        form.append("picking_type_id", document.getElementById("pickingTypeId").value);
        form.append("location_id", document.getElementById("locationId").value);
        form.append("location_dest_id", document.getElementById("locationDestId").value);
        form.append("create_stock_receipt", document.getElementById("createStockReceipt").checked ? "true" : "false");
        for (const file of Array.from(invoiceImage.files || [])) {
          form.append("invoice_images", file);
        }
        return form;
      }

      async function fetchFirstHit(path, query) {
        const response = await fetch(`${path}?query=${encodeURIComponent(query)}&limit=1`);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || formatCopy("lookup_failed", { path }));
        if (!payload.hits?.length) throw new Error(formatCopy("lookup_no_results", { query, path }));
        return payload.hits[0];
      }

      async function loadLocalDefaults() {
        loadDefaultsBtn.disabled = true;
        try {
          const [journal, pickingType, vendorLocation, stockLocation] = await Promise.all([
            fetchFirstHit("/api/v1/odoo/journals/search", "purchase"),
            fetchFirstHit("/api/v1/odoo/picking-types/search", "incoming"),
            fetchFirstHit("/api/v1/odoo/locations/search", "Vendors"),
            fetchFirstHit("/api/v1/odoo/locations/search", "Stock"),
          ]);
          document.getElementById("journalId").value = journal.id;
          document.getElementById("pickingTypeId").value = pickingType.id;
          document.getElementById("locationId").value = vendorLocation.id;
          document.getElementById("locationDestId").value = stockLocation.id;
          addMessage("agent", `
            <div class="meta">${escapeHtml(t("system_meta"))}</div>
            ${formatCopy("defaults_loaded_message", {
              journal_id: journal.id,
              picking_type_id: pickingType.id,
              location_id: vendorLocation.id,
              location_dest_id: stockLocation.id,
            })}
          `);
        } catch (error) {
          addMessage("agent", `<strong>${escapeHtml(t("error_loading_defaults_title"))}</strong><br />${escapeHtml(error.message)}`);
        } finally {
          loadDefaultsBtn.disabled = false;
        }
      }

      async function sendTurn() {
        const text = messageInput.value.trim();
        const files = Array.from(invoiceImage.files || []);
        if (!text && files.length === 0) {
          addMessage("agent", `<strong>${escapeHtml(t("missing_input_title"))}</strong><br />${escapeHtml(t("missing_input_body"))}`);
          return;
        }
        addMessage("user", `
          <div class="meta">${escapeHtml(t("user_meta"))}</div>
          ${text ? `${escapeHtml(text).replaceAll("\n", "<br />")}` : ""}
          ${files.map((file) => `<div class="pill">${escapeHtml(file.name)}</div>`).join("")}
        `);
        sendBtn.disabled = true;
        try {
          const response = await fetch("/api/v1/odoo/purchase-chat/messages", {
            method: "POST",
            body: buildForm(),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.message || t("turn_processing_failed"));
          sessionId = payload.session_id;
          appendAgentResponse(payload);
          messageInput.value = "";
          invoiceImage.value = "";
        } catch (error) {
          addMessage("agent", `<strong>${escapeHtml(t("generic_error_title"))}</strong><br />${escapeHtml(error.message)}`);
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener("click", sendTurn);
      messageInput.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") sendTurn();
      });
      resetBtn.addEventListener("click", () => {
        sessionId = null;
        messages.innerHTML = "";
        stageLabel.textContent = t("new_session_label");
        messageInput.value = "";
        invoiceImage.value = "";
        addMessage("agent", `
          <div class="meta">${escapeHtml(t("agent_meta"))}</div>
          ${escapeHtml(t("welcome_message"))}
        `);
      });
      loadDefaultsBtn.addEventListener("click", loadLocalDefaults);

      hydrateStaticCopy();
      addMessage("agent", `
        <div class="meta">${escapeHtml(t("agent_meta"))}</div>
        ${escapeHtml(t("welcome_message"))}
      `);
    </script>
  </body>
</html>
